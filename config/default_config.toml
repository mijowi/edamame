# edamame configuration

# Name of the active theme.  Resolved to themes/<theme>.toml — the shipped
# default is `themes/default.toml` (written on first run).  Copy it to
# themes/custom.toml, edit, then set `theme = "custom"` to switch.
theme = "default"

### Editor #####################################################################
[editor]
tab_width = 4
dev_mode = false
# Set to true to skip the startup notice that lists unsupported terminal
# features. The "[Don't show this again]" button on the notice also sets this.
suppress_capability_warnings = false
# Lines advanced per mouse-wheel tick. Default 1 (fine control); 2 or 3 gives
# a faster, coarser scroll. This setting also applies to touchpad scroll speed,
# for which 1 might feel better. Keyboard scrolling always steps by one line and
# is unaffected by this setting.
mouse_scroll_lines = 1

### Modal ######################################################################
[modal]
handler = "default"

### Image ######################################################################
[image]
# Master switch for inline image rendering. When false, images always
# render as `[Image: alt]` placeholders even on graphics-capable terminals.
enabled = true
# Ceilings in terminal cells. Images are scaled to fit within
# max_width × max_height while preserving aspect ratio.
max_width = 80
max_height = 24
# Policy for `http(s)://` image URLs: "ask" | "always" | "never".
# "ask" prompts the first time a document with remote images is opened;
# the choice can be persisted via the prompt itself.
remote_policy = "ask"
