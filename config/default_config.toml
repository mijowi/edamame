# edamame default configuration
# Copy relevant sections to ~/.config/edamame/config.toml to override.

[editor]
tab_width = 4
dev_mode = false
# Set to true to skip the startup notice that lists unsupported terminal
# features. The "[Don't show this again]" button on the notice also sets this.
# suppress_capability_warnings = false
# Lines advanced per mouse-wheel tick. Default 1 (fine control); try 2 or 3
# for a faster, coarser scroll. Keyboard ScrollUp / ScrollDown always step by
# one line and are unaffected by this setting.
# mouse_scroll_lines = 1

[theme]
# Colour overrides (full theming deferred to a later phase)

[keybindings]
# Key binding overrides. Examples:
# Quit = "ctrl+q"
# ScrollDown = "down"
# ScrollUp = "up"
#
# Table editing (Phase 2) — org-mode-style Alt+Arrow scheme. Defaults:
# TableMoveRowUp        = "alt+up"
# TableMoveRowDown      = "alt+down"
# TableMoveColumnLeft   = "alt+left"
# TableMoveColumnRight  = "alt+right"
# TableInsertRowAbove   = "alt+shift+up"
# TableInsertRowBelow   = "alt+shift+down"
# TableInsertColumnLeft  = "alt+shift+left"
# TableInsertColumnRight = "alt+shift+right"
# TableDeleteRow        = "alt+backspace"
# TableDeleteColumn     = "alt+shift+backspace"

[modal]
handler = "default"

[image]
# Master switch for inline image rendering. When false, images always
# render as `[Image: alt]` placeholders even on graphics-capable terminals.
enabled = true
# Ceilings in terminal cells. Images are scaled to fit within
# max_width × max_height while preserving aspect ratio.
max_width = 80
max_height = 24
# Policy for `http(s)://` image URLs: "ask" | "always" | "never".
# "ask" prompts the first time a document with remote images is opened;
# the choice can be persisted via the prompt itself.
remote_policy = "ask"
