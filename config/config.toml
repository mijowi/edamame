# edamame configuration
#
# Uncommented lines are values that deviate from the compiled-in defaults, or
# settings we expect users to set explicitly (capability warnings, remote-image
# policy). Anything else appears commented-out as a reference — uncomment and
# edit to override.

# Name of the active theme. Built-in themes (see BUILTIN_THEMES in
# src/config/theme.rs) are resolved by name; any other name is loaded
# from themes/<theme>.toml. To author a custom theme, drop a TOML file
# in themes/ and set `theme` to its stem.
theme = "Edamame"

# Appearance mode — filters the theme picker (Ctrl+Shift+T) so only themes
# matching this mode are shown, and decides which counterpart theme is
# previewed when the mode is toggled.  Must be "dark" or "light".  Default:
# "dark".  Toggle interactively via the picker's [ Dark | Light ] pill
# (Tab / Left / Right or click) or the settings overlay's Appearance row.
appearance = "dark"

# ── Editor ────────────────────────────────────────────────────────────────────
[editor]
# Fingerprints of terminals that have already shown the capabilities notice.
# Dismissing the notice (or completing the welcome modal) appends the current
# terminal's fingerprint here so it won't fire again. Launching in a new,
# previously-unseen terminal re-fires the notice once. Clear this list to see
# the capabilities notice on the next launch.
# seen_terminal_fingerprints = []

# Show line numbers in a left gutter in all modes. Default: false.
# show_line_numbers = false

# Lines advanced per mouse-wheel tick. Default 1 (fine control); 2 or 3 gives
# a faster, coarser scroll. This setting also applies to touchpad scroll speed,
# for which 1 might feel better. Keyboard scrolling always steps by one line and
# is unaffected by this setting.
# mouse_scroll_lines = 1

# Duration (ms) that a transient hint-line notification lingers before
# auto-expiring. Default: 1500. Error messages ignore this and stay until
# dismissed with Esc.
# transient_ms = 1500

# Cap the editor content to a fixed column width and centre it horizontally
# inside the terminal. The bottom status / hint region always spans the full
# terminal width. Has no effect when the terminal is narrower than the cap.
# Default: false (full terminal width is used).
# max_width_enabled = false

# Maximum content width in columns when `max_width_enabled` is true.
# Floored at 20 to keep layout sane. Default: 80.
# max_width_cols = 80

# Silently save the buffer to disk after `autosave_idle_ms` of typing
# inactivity. Only buffers with an associated file path autosave; an
# unnamed buffer (e.g. `edamame` with no filename) is never written.
# A successful autosave flashes "Autosaved" on the hint line.
# Default: false.
# autosave_enabled = false

# Idle window (ms) the user must stop editing for before the pending
# dirty buffer is autosaved. Every keystroke resets the timer, so a
# typing burst produces at most one autosave at the end of the burst.
# Must be strictly between 1000 and 600000 (10 min); out-of-range
# values are ignored at load time (with a warning) and the default is
# used instead. This setting is only configurable via this file —
# the settings overlay exposes only the on/off toggle. Default: 5000.
# autosave_idle_ms = 5000

# Render H1 headings as 4-row "big text" using Quadrant block characters
# (▘▝▖▗▀▄▌▐█), via the `tui-big-text` widget. Falls back to the regular
# one-line styled rendering when the title would exceed the viewport width
# or contains non-ASCII characters. Default: false.
# big_h1 = false

# Blink the editor cursor. When false the cursor is drawn solid and never
# hidden. The settings overlay exposes this on/off toggle. Default: true.
# cursor_blink = true

# Cursor blink half-period in milliseconds — the cursor toggles between
# visible and hidden every `cursor_blink_ms`. Only consulted when
# `cursor_blink` is true. This cadence is file-only (the overlay exposes
# only the on/off toggle). Default: 530.
# cursor_blink_ms = 530

# Review external changes in diff mode. When true (default), a file
# modified on disk while this buffer is clean opens diff-review mode so
# you see each change hunk by hunk before it replaces what's on screen.
# When false, a clean buffer is silently reloaded from disk instead. A
# buffer with unsaved edits always prompts the conflict modal regardless
# (whose [Merge] button still enters diff review on demand). Exposed as
# the "Diff when file changes" toggle in the settings overlay. Default: true.
# diff_on_change = true

# Show the explainer modal when entering diff review. The modal's
# "Don't show this again" checkbox flips this to false; set it back to
# true here to re-enable the intro. File-only (not in the settings
# overlay). Default: true.
# show_diff_intro = true

# ── Modal ─────────────────────────────────────────────────────────────────────
# Which modal handler processes key events. "default" is the non-modal
# chord/shortcut keymap; "vim" enables Vim-style modal editing and motions
# (only a subset of Vim is supported — see the docs). This can also be
# toggled from the first-run welcome modal.
# [modal]
# handler = "default"

# ── Table ─────────────────────────────────────────────────────────────────────
[table]
# Show row / column buttons on tables when the terminal supports mouse
# reporting: `⠿` reorder grips, `⇔` resize glyph, and `✕` row/column
# delete glyphs.  Default: true.
show_buttons = true
# Stripe alternating data rows with `theme.table_row_even` / `table_row_odd`.
row_striping = true
# Show a confirmation modal the first time a column-border drag would inject
# a `<!-- tui-columns: [...] -->` comment into the Markdown source.  The
# modal's "Continue and don't ask again" button flips this to false.
warn_on_width_injection = true

# ── Images ────────────────────────────────────────────────────────────────────
[images]
# Master switch for inline image rendering: "ask" | "always" | "never".
enabled = "ask"
# Ceilings in terminal cells. Images are scaled to fit within
# max_width × max_height while preserving aspect ratio. Defaults: 80 × 24.
# max_width = 80
# max_height = 24
# Policy for `http(s)://` image URLs: "ask" | "always" | "never".
remote_policy = "ask"

# ── Diagrams ──────────────────────────────────────────────────────────────────
[diagrams]
# Master switch for inline diagram rendering (e.g. ```mermaid):
# "ask" | "always" | "never".  Kept separate from `[images].enabled` so a
# user can opt in to one without the other.
enabled = "ask"

# ── Export ────────────────────────────────────────────────────────────────────
# HTML is edamame's single built-in export target. It also serves as the
# intermediate format for custom commands (see [[export.custom]] below), so
# PDF / DOCX / etc. are one external-tool invocation away.
# These are the defaults the Export HTML modal opens with; choosing different
# options in that modal writes them back here.
# [export.html]
# stylesheet     = "builtin"    # "builtin" (the bundled default), or a path to
#                               # a .css file. Drop custom stylesheets in the
#                               # `export/` folder beside this file and they
#                               # show up in the Export HTML modal's picker. A
#                               # `default.css.example` reference is written
#                               # there on first run — copy it to `<name>.css`
#                               # and edit it as a starting point.
# inline_images  = false        # when true, local images are base64-embedded
# diagrams       = true         # render ```mermaid blocks as inline SVG
#                               # (false → leave as <pre><code class="language-mermaid">)

# Add one or more [[export.custom]] blocks to pipe the generated HTML through
# an external tool. Each entry becomes an "Export <name>" item in the command
# palette (Phase 10). {html} is substituted with the temp HTML file path and
# {out} with the final output path (source stem + configured extension).
#
# [[export.custom]]
# name      = "PDF (weasyprint)"
# command   = ["weasyprint", "{html}", "{out}"]
# extension = "pdf"
#
# [[export.custom]]
# name      = "DOCX (pandoc)"
# command   = ["pandoc", "{html}", "-o", "{out}"]
# extension = "docx"

# ── Dev ───────────────────────────────────────────────────────────────────────
# Developer tooling. When `logging` is true, structured `tracing` logs are
# written to the XDG data directory (e.g. ~/.local/share/edamame/); otherwise
# the tracing subscriber is never initialized and all `tracing::*` calls are
# no-ops. Default: false — keeps the TUI silent in normal use.
# [dev]
# logging = false
