# edamame default theme.
#
# Regenerate this file with:
#     cargo test -- --ignored regenerate_default_theme_toml
# after changing `Theme::default()` or `Palette::default()` in
# src/config/theme.rs.  See `theming.md` in the repo root for the
# full design guide.
#
# ─── How theming works ────────────────────────────────────────────────
#
# A theme is a small named palette plus a flat table of styles.  Every
# style in the UI derives from the palette, so re-tinting edamame
# end-to-end is usually a matter of editing the `[palette]` section and
# letting every style fall through.
#
# The palette names map onto roles, not specific hues:
#
#   default_text / default_bg
#       The "blank page" colours.  default_bg is also used as a *fg*
#       colour for inverse text (e.g. the rendered/raw mode chip in
#       the status bar, or text on a search-highlight band) — pick a
#       value that contrasts with the bright palette colours.
#
#   primary             Brand colour.  Headings, mode chip, status
#                       cursor info.  Default is warm orange.
#   emphasis            Highlights, hints, warnings.  Default is yellow.
#   structural          Frames, dividers, list bullets, blockquote
#                       bars.  Default is lavender.
#   interactive         Links, focus, selection bg.  Default is blue.
#   success             Completed tasks, success notifications.
#                       Default is green.
#   warning             Same role as `emphasis` in this theme; split
#                       so themes can colour them differently.
#   error               Errors and destructive actions.  Default red.
#   muted               Borders and peripheral text (e.g. h6, the
#                       Preview mode chip's bg, strikethrough text).
#                       Grey.
#   surface             Two chrome surfaces:
#                         bright_surface — status bar, modal body,
#                                          inline / fenced code bg,
#                                          row-striping fill
#                         dim_surface    — hint line and the
#                                          transient-message strip
#                                          that overlays it
#
# Each colour has a `bright_*` and `dim_*` variant.  The bright shade
# is the "loud" version (headings, primary chord glyph, mode chip
# fill); the dim shade is the "quiet" version (heading anchors,
# borders, secondary surfaces).  Aim for roughly 30% lightness
# contrast between the two so both read on a dark surface.
#
# ─── Authoring a theme ────────────────────────────────────────────────
#
# 1. Copy this file to `themes/<your-theme-name>.toml` in your config
#    directory.
# 2. Edit the `[palette]` section.  In most cases that's all you need
#    — every style below derives from the palette at load time and
#    will track your new shades automatically.
# 3. Optionally, override individual styles by filling in the matching
#    `[h1]`, `[modal_input_focused]`, etc. table below.  The headers
#    are listed bare (no `fg` / `bg` / modifier fields) precisely so
#    you can see the full set of override slots and add fields under
#    whichever you want to customise.  Anything you leave empty falls
#    through to the palette-derived default.
# 4. Activate the theme by setting `theme = "<your-theme-name>"` in
#    `config.toml`.
#
# Colour values accept named CSS-ish colours (`"orange"`), six-digit
# hex (`"#ff8c3c"`), or 256-colour palette indices either as a string
# (`"236"`) or a bare integer (`236`).  Modifier flags (`bold`,
# `italic`, `underlined`, `reversed`, `crossed_out`, `dim`) accept
# `true` / `false` and combine freely.
#
# ─── Style merge order ────────────────────────────────────────────────
#
# At load time edamame runs a three-stage merge:
#
#   1. Start from the compiled-in default palette.
#   2. Apply your `[palette]` overrides on top.
#   3. Build a fresh style table from the merged palette, then apply
#      any per-element style overrides from this file.
#
# An empty style section (e.g. just `[h1]` with no fields) is treated
# as "no override" — the palette-derived default wins.  That's why the
# default ships with empty headers: they are intentionally palette-
# only, so editing the palette retints the whole UI without the per-
# element sections fighting back.
#
# ─── Per-element override reference ──────────────────────────────────
#
# Every style table accepts the same set of fields.  You can mix and
# match — anything you omit stays at its palette-derived value.
#
#   [some_element]
#   fg          = "#e6e6e6"   # foreground colour
#   bg          = "#121216"   # background colour
#   bold        = true        # SGR bold attribute
#   italic      = true        # SGR italic
#   underlined  = true        # SGR underline
#   reversed    = true        # swap fg/bg at render time
#   crossed_out = true        # strikethrough
#   dim         = true        # SGR faint
#
# Colour values accept any of:
#
#   fg = "yellow"        # ANSI-named colour (case-insensitive).
#                        # The 16-colour names are: black, red, green,
#                        # yellow, blue, magenta, cyan, gray,
#                        # darkgray, lightred, lightgreen,
#                        # lightyellow, lightblue, lightmagenta,
#                        # lightcyan, white.
#   fg = "#ff8c3c"       # six-digit hex
#   fg = "236"           # 256-colour palette index, as a string
#   bg = 236             # 256-colour palette index, as a bare integer
#   fg = "Reset"         # explicit terminal default — punches through
#                        # the theme's `default_text` / `default_bg`
#                        # so the underlying terminal colour shows.
#                        # Useful on `[normal]` for users who want
#                        # edamame to inherit their terminal's bg.
#
# Worked example — make H1 a green underlined heading without any
# bold weight, and give the inline-code span an explicit dark-grey
# background regardless of palette:
#
#   [h1]
#   fg         = "#9ad26e"
#   underlined = true
#   bold       = false       # (also the default; shown for clarity)
#
#   [code_span]
#   fg = "lightyellow"
#   bg = "#1a1a1f"
#
# Worked example — opt out of the theme's coloured document surface
# so edamame inherits whatever bg your terminal is using:
#
#   [normal]
#   fg = "Reset"
#   bg = "Reset"
#
# Worked example — give the focused mode chip a louder treatment by
# stacking modifiers:
#
#   [status_mode_rendered]
#   fg          = "#121216"
#   bg          = "#ff963c"
#   bold        = true
#   reversed    = true

task_strikethrough = true

[palette]
default_text = "#E6E6E6"
default_bg = "#121216"
bright_primary = "#FF963C"
dim_primary = "#B86822"
bright_emphasis = "#F5D25A"
dim_emphasis = "#B8963C"
bright_structural = "#B690E0"
dim_structural = "#7860A6"
bright_interactive = "#73B4EB"
dim_interactive = "#3A6BB0"
bright_success = "#9AD26E"
dim_success = "#5E9046"
bright_warning = "#F5D25A"
dim_warning = "#B8963C"
bright_error = "#EB7373"
dim_error = "#A84040"
bright_muted = "#B4B4BA"
dim_muted = "#737378"
surface_bright = 236
surface_dim = 238

