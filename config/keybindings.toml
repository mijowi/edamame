# edamame keybindings
#
# Every line below is a configurable action with its default key. Uncomment a
# line and change the key to override the default; any action you leave
# commented keeps its compiled-in binding.
#
# Syntax: <ActionName> = "<modifiers>+<key>"
#   modifiers: "ctrl", "alt", "shift" (combine with `+`)
#   key:       single character, "up", "down", "left", "right",
#              "space", "enter", "tab", "backspace", "delete",
#              "home", "end", "pageup", "pagedown", "esc", or "f1".."f12"
#
# Examples:
#   Quit = "ctrl+q"
#   Save = "ctrl+s"

# ── File ──────────────────────────────────────────────────────────────────────
# Save                   = "ctrl+s"
# Open                   = "ctrl+o"
# Quit                   = "ctrl+q"

# ── Clipboard ─────────────────────────────────────────────────────────────────
# Cut                    = "ctrl+x"
# Copy                   = "ctrl+c"
# Paste                  = "ctrl+v"

# ── History ───────────────────────────────────────────────────────────────────
# Undo                   = "ctrl+z"
# Redo                   = "ctrl+y"

# ── Formatting ────────────────────────────────────────────────────────────────
# Wrap the selected text in bold / italic markers (toggles back off if the
# selection is already exactly bold / italic).
#
# Heads-up: Ctrl-i shares an encoding with Tab, and Ctrl-b with ASCII 0x02, on
# terminals that lack the kitty keyboard protocol — there Ctrl-i inserts a Tab
# and Ctrl-b does nothing. Rebind to e.g. "ctrl+shift+b" / "ctrl+shift+i" if
# yours is affected, or run the actions from the command palette (Ctrl-P).
# BoldSelection          = "ctrl+b"
# ItalicizeSelection     = "ctrl+i"
#
# The remaining selection wraps — inline code (`), strikethrough (~~), and
# highlight (==) — have no default key; run them from the command palette
# (Ctrl-P) or bind a chord here.
# InlineCodeSelection    = ""
# StrikethroughSelection = ""
# HighlightSelection     = ""

# ── Insert ────────────────────────────────────────────────────────────────────
# InsertTable opens the rows/columns prompt (the cursor must be on a blank
# line). InsertLink and InsertImage drop a `[link text](file path or URL)` /
# `![alt text](file path or URL)` snippet at the cursor, or wrap the selection
# as the visible text; the placeholder is left selected so typing replaces it.
# InsertLink and InsertImage have no default key — run them from the command
# palette (Ctrl-P) or bind a chord here.
# InsertTable            = "ctrl+shift+t"
# InsertLink             = ""
# InsertImage            = ""

# ── View ──────────────────────────────────────────────────────────────────────
# ToggleRawMode          = "ctrl+`"

# ── List ──────────────────────────────────────────────────────────────────────
# ToggleCheckbox         = "ctrl+space"

# ── Links ─────────────────────────────────────────────────────────────────────
# FollowLinkUnderCursor  = "ctrl+enter"
#
# NavigateBack and NavigateForward have no dedicated default key — they are
# triggered by Alt+Left / Alt+Right whenever the cursor is outside a table
# (inside a table, those keys reorder columns). Uncomment and set a key to
# bind them unconditionally.
# NavigateBack           = ""
# NavigateForward        = ""

# ── Footnotes ─────────────────────────────────────────────────────────────────
# Footnote actions have no default key — run them from the command palette
# (Ctrl-P) or bind a chord here. InsertFootnote drops an auto-numbered `[^N]`
# reference at the cursor; DeleteFootnote removes the footnote at the cursor
# (every reference plus its definition) and renumbers; RenumberFootnotes
# re-sequences all numeric footnotes into order of first reference.
# InsertFootnote         = ""
# DeleteFootnote         = ""
# RenumberFootnotes      = ""

# ── Table — cell navigation ──────────────────────────────────────────────────
# TablePrevCell          = "shift+tab"
#
# TableNextCell and TableNextRow have no dedicated default key — Tab and Enter
# do the same thing when the cursor is inside a table (and insert a tab or
# newline otherwise). TablePrevRow is unbound by default. Uncomment and set
# a key to bind any of these unconditionally.
# TableNextCell          = ""
# TableNextRow           = ""
# TablePrevRow           = ""

# ── Table — reorder rows/columns ─────────────────────────────────────────────
# TableMoveRowUp         = "alt+up"
# TableMoveRowDown       = "alt+down"
# TableMoveColumnLeft    = "alt+left"
# TableMoveColumnRight   = "alt+right"

# ── Table — insert rows/columns ──────────────────────────────────────────────
# TableInsertRowAbove    = "alt+shift+up"
# TableInsertRowBelow    = "alt+shift+down"
# TableInsertColumnLeft  = "alt+shift+left"
# TableInsertColumnRight = "alt+shift+right"

# ── Table — delete rows/columns ──────────────────────────────────────────────
# TableDeleteRow         = "alt+backspace"
# TableDeleteColumn      = "alt+shift+backspace"

# ── Table — cell line break ──────────────────────────────────────────────────
# TableInsertBreak       = "shift+enter"
