[package]
name = "edamame"
version = "0.1.0"
edition = "2021"
description = "A fast, jank-free TUI Markdown editor and viewer"

[[bin]]
name = "edamame"
path = "src/main.rs"

[lib]
name = "edamame"
path = "src/lib.rs"

[dependencies]
# TUI framework and terminal backend.  The `serde` feature is enabled so
# `ratatui::style::Color` deserializes from strings ("red", "#ff00aa", "42")
# directly inside our `ThemeFile` TOML layer.
ratatui = { version = "0.30", features = ["serde", "crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = "0.29"

# Markdown parsing
pulldown-cmark = "0.13"

# Rope-based text buffer
ropey = "1.6"

# Config serialization
serde = { version = "1", features = ["derive"] }
toml = "1"
# Format-preserving TOML parser.  Used by `Config::save` to surgically
# update values in the user's `config.toml` while preserving comments,
# blank lines, and section ordering — the shipped reference config is
# heavily annotated, and a serde round-trip would nuke that.
toml_edit = "0.25"
# Detects unknown keys during deserialization so the config loader can
# surface "unrecognized field" warnings without forcing `deny_unknown_fields`
# on the structs (we want forward-compat for theme files, not strictness).
serde_ignored = "0.1"

# Platform paths (XDG_CONFIG_HOME etc.)
dirs = "6"

# Error handling
thiserror = "2"
anyhow = "1"

# Structured logging (to file only; never stdout)
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Unicode helpers
unicode-width = "0.2"
unicode-segmentation = "1"

# Clipboard (OS clipboard with kill-ring fallback).  `wayland-data-control`
# is NOT in arboard's default feature set but is required for read access on
# pure-Wayland systems (Sway, GNOME without XWayland, etc.); without it
# `Clipboard::new()` returns `Err` on Wayland and paste from external apps
# silently falls back to the in-process kill-ring.
arboard = { version = "3", optional = true, features = ["wayland-data-control"] }

# Terminal image-protocol probing (Picker::from_query_stdio).
# `chafa-dyn` is skipped to avoid a system-library dependency on libchafa —
# we only use the Picker for detection, not for actual halfblock rendering.
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }

# Image format decoding — transitively pulled by ratatui-image, listed
# explicitly so `DynamicImage` and `ImageError` are reachable from our own
# code and the decode branches in `src/image/loader.rs` can compile
# independently of whether ratatui-image re-exports them.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

# Blocking HTTP client for remote image fetches (Phase 7).  Uses rustls
# (not native-tls/OpenSSL) so we have no system-library dependency.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Cross-platform URL / file opener used by Phase 8 link navigation.
# Shells out to `xdg-open` / `open` / `start` depending on platform — no
# system-library dependency.
open = "5"

# Phase 10 — fuzzy matching for the command palette.  Helix uses the
# parent `nucleo` crate; we only need the matcher (no async source
# layer), so we depend on `nucleo-matcher` directly.
nucleo-matcher = "0.3"

# Phase 16 — HTML export:
# `base64` encodes local image bytes into `data:` URIs when the user opts in
# to self-contained HTML. `tempfile` hosts the intermediate HTML file for
# custom-command exports (pandoc, weasyprint, …), cleaned up on drop.
base64 = "0.22"
tempfile = "3"

# Phase 17 — Mermaid diagrams:
# `mermaid-rs-renderer` is pinned tightly because it's pre-1.0 with known
# panic bugs and rapid churn.  `default-features = false` drops the `cli`
# feature (which would pull `clap`) and keeps only `png` (which pulls
# `resvg` + `usvg`).  `resvg` and `usvg` are declared explicitly because
# `src/diagram/mermaid.rs` calls their APIs directly for the in-memory
# SVG→PNG path (the crate's public `write_output_png` writes to a
# `&Path` — we need `Vec<u8>` so the decode worker can feed
# `image::load_from_memory` without a tempfile).  Versions MUST match
# what mermaid-rs-renderer 0.2.1 pulls in transitively (resvg 0.46,
# usvg 0.46) so cargo doesn't compile two copies.  `tiny_skia` is NOT
# listed — we use `resvg::tiny_skia::*` re-exports to guarantee the
# version stays locked to resvg's choice.
mermaid-rs-renderer = { version = "=0.2.2", default-features = false, features = ["png"] }
resvg = "0.46"
usvg = "0.46"
# `sha2` produces the synthetic cache-key URLs `diagram-mermaid-<sha>` —
# stable across reparses so the image cache can reuse already-rendered
# diagrams when a keystroke elsewhere in the document triggers a reparse.
sha2 = "0.10"

# Big-text rendering for H1 headings.  Tracks the ratatui 0.30 line via
# tui-big-text 0.8+; uses `font8x8` glyphs painted via Octant block
# characters (4 cells wide × 2 cells tall per glyph).
tui-big-text = "0.8"

# Cross-platform filesystem watcher.  Pinned to the current major (8.x);
# 6→7→8 reshaped the `RecommendedWatcher` constructor and `Event` types.
# Default features include backends for Linux (inotify), macOS (FSEvents),
# and Windows (ReadDirectoryChanges).
notify = "8"

# Fast non-cryptographic hash for the watcher's own-write content-hash
# filter.  Zero dependencies and sub-microsecond on typical Markdown
# files — used to skip echoes of our own saves rather than to provide
# any cryptographic guarantee.
seahash = "4"

# Line-level + inline word-level diff used by the diff-mode review
# subsystem (Phase 1 §3).  `TextDiff::from_lines` produces line hunks;
# `InlineChange` slices each `Replace` hunk into word-level highlights
# without us writing a tokenizer.
similar = "2"

[features]
default = ["clipboard"]
clipboard = ["arboard"]

[dev-dependencies]
# Snapshot testing for rendered output
insta = { version = "1", features = ["ron"] }
# Property-based testing
proptest = "1"
# Parse/render pipeline benchmarks (see docs/perf-benchmark-plan.md).
# Criterion runs benches in release mode by default, which matters — the
# dev profile below is tuned for compile speed, not runtime speed.
criterion = "0.5"
# Note: `tempfile` is a runtime dep (used by export/custom.rs); no separate
# dev-dependency entry is needed — dev code can import it the same way.

[[bench]]
name = "pipeline"
harness = false

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
