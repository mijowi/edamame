[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "mijowi/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax).
#
# `x86_64-pc-windows-msvc` is deliberately absent: edamame has never been
# tested on Windows, and the CI job for it is non-blocking for that reason
# (.github/workflows/ci.yml).  Shipping a release binary and an installer for
# a platform we don't claim to support invites bug reports we can't act on.
# Add the target back in the same change that promotes that job into the
# blocking test matrix.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = false
