version: 2

updates:
  # Cargo dependencies.  Grouped aggressively: edamame has ~40 direct
  # dependencies and many more transitively, and ungrouped Dependabot on a
  # tree that size produces a PR per crate per week — enough noise that the
  # security-relevant ones get lost in it.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Everything non-breaking in one PR.  CI covers it; if it is green
      # this is a single click.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Majors stay separate — each one needs reading.
      major:
        update-types:
          - major
    ignore:
      # Pinned exactly (`=0.2.2`) because it is pre-1.0 with known panic
      # bugs, and because `resvg` / `usvg` must stay on the versions it
      # depends on or cargo compiles two copies of each.  Upgrading is a
      # deliberate, tested change — see AGENTS.md and docs/security.md — not
      # something to merge from a bot PR.
      - dependency-name: mermaid-rs-renderer
      - dependency-name: resvg
      - dependency-name: usvg

  # Workflow actions.  Cheap to keep current, and stale action versions are
  # a common source of sudden CI breakage when a runner image changes.
  #
  # The github-actions updater scans every file in `.github/workflows` and
  # there is no way to exclude one — `directories` globs at the directory
  # level, and no `exclude-paths` key exists.  But
  # `.github/workflows/release.yml` is GENERATED BY `dist` and must match
  # byte-for-byte what the pinned dist version emits; `dist plan` fails on
  # drift, which is how it caught PR #18 bumping `actions/checkout` there.
  # A bot PR that breaks the release pipeline is worse than a stale action,
  # so the three actions that file uses are ignored wholesale below.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # Used ONLY by the dist-generated release.yml.  `dist init` (re-run
      # when dist itself is upgraded) is what bumps these — see
      # docs/dev/plans/publish.md.
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
      # Also used by ci.yml and audit.yml, so this one costs something: it
      # has to be bumped BY HAND in those two files.  Worth it — checkout is
      # among the most stable actions in existence, and the alternative is
      # hand-reverting one hunk of every actions PR forever.  Note that an
      # ignore entry suppresses Dependabot's security PRs too, so if
      # actions/checkout ever carries an advisory it will not be raised here.
      - dependency-name: actions/checkout
