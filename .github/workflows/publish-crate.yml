# Publishes the crate to crates.io using Trusted Publishing (OIDC).
#
# No API token is stored anywhere: `rust-lang/crates-io-auth-action` exchanges
# GitHub's short-lived OIDC token for a temporary, scoped crates.io token that is
# automatically revoked when the job ends. crates.io must first be told to trust
# this repository + workflow — see the one-time setup in docs/dev/release.md.
#
# Triggers on the same version tags as release.yml (cargo-dist), so a single
# `git tag vX.Y.Z && git push --tags` cuts the GitHub Release *and* the crates.io
# publish. `cargo publish` reads the version from Cargo.toml, so make sure the
# manifest is bumped before tagging.

name: Publish to crates.io

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

# Least privilege: id-token to mint the OIDC token, contents:read to check out.
permissions:
  id-token: write
  contents: read

# Never let two publishes of the same tag race.
concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Approval gate: this environment has a required reviewer, so each tag pauses
    # for a manual click before publishing. The same name must be entered in the
    # crates.io Trusted Publishing config's "Environment name" field.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked --token ${{ steps.auth.outputs.token }}
