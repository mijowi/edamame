name: Feature request
description: Suggest something edamame should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep in mind that edamame has a narrow focus on editing Markdown.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Please state what you are *trying to do*, not just what new feature would do it.

        What was the task or friction that prompted this? What do you do today instead, and why is that unsatisfying?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like edamame to do?
      description: >
        If you have a specific design in mind — a key, a command, a setting — describe it. If another editor solves this, saying which one and how it behaves is very helpful.
    validations:
      required: false
