name: Bug report
description: Something isn't working the way you expected.
labels: ["bug"]
body:

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >
        What went wrong, and what you expected instead.
      placeholder: |
        Useful things to include:

        - A screenshot, for anything visual. Rendering bugs are much easier
          to understand with a picture.
        - Logs. Run "edamame --log yourfile.md", reproduce, then attach the
          log — the path is printed when edamame exits. This is mainly
          necessary for more complex bugs.
        - A backtrace, if it crashed: run with RUST_BACKTRACE=1.
        - Your config.toml, if the bug only happens with your settings.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a file containing the Markdown below
        2. Move the cursor onto line 3
        3. Press Tab
    validations:
      required: false

  - type: textarea
    id: sample
    attributes:
      label: Minimal Markdown that triggers it
      description: >
        If this is a rendering, table, list or parsing bug, write the smallest Markdown snippet that shows the problem.
      render: markdown
    validations:
      required: false

  # Note: GitHub issue forms do not allow `render:` on a required field, so
  # this one is a plain textarea rather than a code block.
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics (`edamame --doctor`)
      description: |
        **Some edamame bugs turn out to be terminal-specific.** Features like images, themes, and some key chords depend on what your terminal supports. This information may determine whether a report can be reproduced, so please don't skip it.

        Run `edamame --doctor` in the **same terminal application** where the bug happens and paste the whole output. It reports the edamame version, your OS, your terminal and its version, and edamame's own view of what that terminal supports. Copy it from the screen rather than redirecting it to a file — with output redirected, edamame can't ask the terminal about images and keyboard support and reports both as unknown.
      placeholder: |
        edamame 0.1.0

        System
          OS:         macOS 15.6 (aarch64)
          Terminal:   ghostty 1.3.1
          TERM:       xterm-ghostty
          COLORTERM:  truecolor
          Locale:     en_US.UTF-8 (LANG)
          tmux:       no

        Terminal capabilities
          ok   Color:     truecolor (24-bit)
          ok   Images:    Kitty graphics
          ok   Mouse:     enabled
          ok   Keyboard:  Kitty keyboard protocol
          ok   Unicode:   UTF-8 locale
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install edamame?
      options:
        - Homebrew
        - cargo install
        - Release binary from GitHub
        - Built from source
        - Other / not sure
    validations:
      required: false

  - type: checkboxes
    id: clean-config
    attributes:
      label: Checks
      options:
        - label: >
            It still happens with a clean config —
            `edamame --no-config yourfile.md`
          required: false
        - label: I searched existing issues for this
          required: false
