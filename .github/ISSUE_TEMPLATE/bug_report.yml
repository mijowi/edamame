name: Bug report
description: Something isn't working the way you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue.

        **Many edamame bugs turn out to be terminal-specific.** Features like images, themes and some key chords depend on what your terminal supports. The questions below about your terminal may decide whether a report can be reproduced, so please don't skip them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a file containing the Markdown below
        2. Move the cursor onto line 3
        3. Press Tab
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Minimal Markdown that triggers it
      description: >
        If this is a rendering, table, list or parsing bug, write the smallest Markdown snippet that shows the problem. A five-line example is far more likely to get fixed quickly.
      render: markdown
    validations:
      required: false

  # Note: GitHub issue forms do not allow `render:` on a required field, so
  # this one is a plain textarea rather than a code block.
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics (`edamame --doctor`)
      description: >
        Run `edamame --doctor` in the **same terminal application** where the bug happens and paste the whole output. It reports the edamame version, your OS, your terminal and its version, and edamame's own view of what that terminal supports which is usually the fastest way to explain a rendering or key-chord problem. Copy it from the screen rather than redirecting it to a file — with output redirected, edamame can't ask the terminal about images and keyboard support and reports both as unknown. 
      placeholder: |
        edamame 0.1.0

        System
          OS:         macOS 15.6 (aarch64)
          Terminal:   ghostty 1.3.1
          TERM:       xterm-ghostty
          COLORTERM:  truecolor
          Locale:     en_US.UTF-8 (LANG)
          tmux:       no

        Terminal capabilities
          ok   Color:     truecolor (24-bit)
          ok   Images:    Kitty graphics
          ok   Mouse:     enabled
          ok   Keyboard:  Kitty keyboard protocol
          ok   Unicode:   UTF-8 locale
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install edamame?
      options:
        - Homebrew
        - cargo install
        - Release binary from GitHub
        - Built from source
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: multiplexer
    attributes:
      label: Running inside a multiplexer?
      description: >
        This matters more than it looks. A multiplexer sits between edamame and your real terminal, and can report capabilities that no longer match it — especially a session you detached from one terminal and reattached from another.
      options:
        - "No"
        - tmux
        - screen
        - Zellij
        - Other
    validations:
      required: true

  - type: checkboxes
    id: clean-config
    attributes:
      label: Checks
      options:
        - label: >
            It still happens with a clean config —
            `edamame --no-config yourfile.md`
          required: false
        - label: I searched existing issues for this
          required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Optional. Useful additions:

        - **A screenshot**, for anything visual. Rendering bugs are much easier to understand with a picture. - **Logs.** Run `edamame --log yourfile.md`, reproduce, then attach the log — the path is printed when edamame exits. - **A backtrace**, if it crashed: run with `RUST_BACKTRACE=1`. - Your `config.toml`, if the bug only happens with your settings.
    validations:
      required: false
