# Blank issues are OFF.
#
# The bug form collects the terminal details most edamame reports need —
# protocol, color depth, $TERM — and a blank issue almost never has them.
# That only outweighs the friction because Discussions now catches
# everything the forms don't cover: questions, "the docs are wrong",
# half-formed ideas. Q&A is listed first below so it's the first thing a
# reporter sees on the chooser.
#
blank_issues_enabled: false

contact_links:
  - name: Question, or something not working the way you expected
    url: https://github.com/mijowi/edamame/discussions/new?category=q-a
    about: >
      Ask in Discussions. If it turns out to be a bug, it can become an issue from there.

  - name: Security vulnerability
    url: https://github.com/mijowi/edamame/security/advisories/new
    about: >
      Please report privately, not as a public issue.

  - name: Documentation
    url: https://github.com/mijowi/edamame/blob/main/docs/getting-started.md
    about: >
      Keybindings, configuration, themes and vim mode are all documented; please have a look at the docs before filing.

  - name: Anything else
    url: https://github.com/mijowi/edamame/discussions/new?category=general
    about: >
      Ideas, workflows, what you're using edamame for, etc.
